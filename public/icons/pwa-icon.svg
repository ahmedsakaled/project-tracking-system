<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e3a" />
      <stop offset="50%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Water Drop Cyan Gradient -->
    <linearGradient id="drop-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glass Ring Gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- iOS / PWA Squircle Background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg-grad)" />

  <!-- Subtle Geometric Blueprint Lines -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#ring-grad)" stroke-width="1.5" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" />

  <!-- Outer Engineering Gear / Progress Circle Arc -->
  <path d="M 126,256 A 130,130 0 1,1 386,256 A 130,130 0 0,1 256,386" 
        fill="none" stroke="url(#drop-grad)" stroke-width="12" stroke-linecap="round" filter="url(#shadow)" />

  <path d="M 256,126 A 130,130 0 0,1 386,256" 
        fill="none" stroke="url(#gold-grad)" stroke-width="12" stroke-linecap="round" />

  <!-- Central Water Drop Symbol (Anbar Water Emblem) -->
  <g filter="url(#shadow)">
    <!-- Drop Base -->
    <path d="M 256,140 
             C 256,140 336,250 336,305 
             A 80,80 0 0,1 176,305 
             C 176,250 256,140 256,140 Z" 
          fill="url(#drop-grad)" />

    <!-- Inner Golden Water Wave & Progress Line -->
    <path d="M 190,295 C 220,315 250,275 280,295 C 300,308 315,302 322,295" 
          fill="none" stroke="url(#gold-grad)" stroke-width="8" stroke-linecap="round" />

    <!-- Project Pulse Sparkle Highlight -->
    <circle cx="230" cy="210" r="14" fill="#ffffff" fill-opacity="0.4" />
    <circle cx="256" cy="180" r="8" fill="#ffffff" fill-opacity="0.6" />
  </g>

  <!-- Crown / Quality Badge Dot at top -->
  <circle cx="256" cy="90" r="10" fill="url(#gold-grad)" filter="url(#shadow)" />
</svg>
